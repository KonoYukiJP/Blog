<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KoyuBlog</title>
        <link rel="icon", href="/favicon.png">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
    </head>
</html>
<body>
    <div id="header"></div>
    
    <main>
        <h2>Profile</h2>
        <h3>こゆ</h3>
        <p>プログラミングします</p>

        <h2>Works</h2>
        <div class="list">
            <a href="terminal/">
                <div class="cell">
                    <img src="/images/mac.svg" alt="Terminal">
                    <p>Terminal</p>
                </div>
            </a>
            <a href="html/">
                <div class="cell">
                    <img src="/images/web.svg" alt="html">
                    <p>HTML</p>
                </div>
            </a>
            <a href="https://koyu.ddns.net/chat/">
                <div class="cell">
                    <img src="/images/chat.svg" alt="チャット">
                    <p>チャット</p>
                </div>
            </a>
        </div>
    </main>

    <div id="footer"></div>

    <script>
        fetch("/header.html")
        .then(res => res.text())
        .then(html => document.getElementById("header").innerHTML = html);

        fetch("/footer.html")
        .then(res => res.text())
        .then(html => document.getElementById("footer").innerHTML = html);
    </script>
</body>
